<div class="menu" id="menu">
  <div class="checker"></div>
  <div class="mtop"><img class="mlogo art" id="menuLogo" alt="Recipe Lab"></div>
  <div class="mid">
    <div class="mart" id="mart"></div>
  </div>
  <div class="mactions">
    <button class="mbtn" id="mCreate">Créer une fiche technique</button>
    <button class="mbtn alt" id="mEdit">Modifier une fiche technique</button>
    <button class="mbtn small" id="mOptions" aria-expanded="false">Options</button>
    <div class="mopts" id="mopts">
      <button class="skinbtn" data-skin="creme"><span class="duo"><i style="background:#F4EFE2"></i><i style="background:#FB511A"></i></span>Crème</button>
      <button class="skinbtn" data-skin="jaune"><span class="duo"><i style="background:#F5F099"></i><i style="background:#FB511A"></i></span>Jaune</button>
      <button class="skinbtn" data-skin="orange"><span class="duo"><i style="background:#FB511A"></i><i style="background:#F4EFE2"></i></span>Inversé</button>
    </div>
    <button class="resume" id="mResume" hidden>Reprendre la fiche en cours</button>
  </div>
  <div class="mfoot">
    <span>© <span class="yr">2026</span> <a href="https://www.giraudi.com/" target="_blank" rel="noopener">By Giraudi</a></span>
    <button class="credits">Crédits &amp; mentions légales</button>
    <span class="ver">Version</span>
  </div>
</div>

<div class="app">
  <header class="topbar">
    <button class="home" id="goHome" title="Retour au menu">
      <img class="art" id="brandLogo" alt="Recipe Lab">
      <span class="tag">Menu principal</span>
    </button>
    <div class="spacer"></div>
    <div class="langtabs" id="langtabs">
      <span class="lbl">Contenu</span>
      <button class="chip" data-lang="fr" aria-pressed="true">FR</button>
      <button class="chip" data-lang="en" aria-pressed="false">EN</button>
      <button class="chip" data-lang="it" aria-pressed="false">IT</button>
    </div>
    <button class="btn" id="goImport">Modifier une fiche</button>
    <button class="btn solid" id="goExport">Exporter</button>
  </header>
  <div class="checker"></div>

  <div class="viewtabs">
    <button class="chip" data-view="edit" aria-pressed="true">Éditer</button>
    <button class="chip" data-view="prev" aria-pressed="false">Aperçu</button>
  </div>

  <div class="main" data-view="edit" id="main">
    <div class="editor" id="editor"></div>
    <div class="stage" id="stage">
      <div class="stagebar">
        <button class="chip" id="zOut" title="Réduire">−</button>
        <span id="zVal">100 %</span>
        <button class="chip" id="zIn" title="Agrandir">+</button>
        <span style="width:14px"></span>
        <span>Aperçu&nbsp;: <b id="prevLang">Français</b></span>
      </div>
      <div id="warn"></div>
      <div class="sheetwrap" id="sheetwrap">
        <div class="sheetscale" id="scaler">
          <div class="sheet" id="sheet"></div>
        </div>
      </div>
    </div>
  </div>

  <footer class="foot">
    <img class="art" id="footChar1" alt="">
    <span>© <span class="yr">2026</span> <a href="https://www.giraudi.com/" target="_blank" rel="noopener">By Giraudi</a></span>
    <span class="spacer"></span>
    <button class="chip credits">Crédits &amp; mentions légales</button>
    <span class="ver" style="opacity:.7">Version</span>
  </footer>
</div>

<div class="offscreen" id="offscreen"></div>
